<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="ovEnTitle ovEnDesc">
  <title id="ovEnTitle">HTML Atelier feature map</title>
  <desc id="ovEnDesc">A static HTML file opened in an Obsidian window: the main view offers Preview, Edit, Source and Split modes; the sidebar workbench has a persistent search field plus Edit, Outline, Changes and Resources tabs. Edits rewrite only the affected source ranges, saving writes them back to the file, and drafts, three-way merge, note embeds and links/anchors are covered too.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#402b1d" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a9622f"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#fbf7f0"/>

  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <!-- header -->
    <text x="48" y="72" font-size="26" letter-spacing="3" fill="#a9622f">HTML ATELIER · FEATURE MAP</text>
    <text x="48" y="128" font-size="46" font-weight="700" fill="#2f2724">From opening a file to writing source back</text>
    <text x="48" y="174" font-size="26" fill="#6f6056">Preview and edit in the main view; search, outline, changes and resources in the sidebar; saving rewrites only affected ranges.</text>

    <!-- left: input file -->
    <rect x="48" y="212" width="264" height="580" rx="20" fill="#fffdfa" stroke="#583a25" stroke-opacity="0.12" stroke-width="1.5" filter="url(#soft)"/>
    <text x="74" y="282" font-size="34" font-weight="700" fill="#2f2724">Input file</text>
    <text x="74" y="320" font-size="26" fill="#6f6056">Vault pages</text>
    <rect x="74" y="344" width="102" height="50" rx="14" fill="#f3e3cf" stroke="#a9622f" stroke-opacity="0.28"/>
    <text x="125" y="378" font-size="26" text-anchor="middle" font-family="'Cascadia Code','Consolas','Courier New',monospace" fill="#6d3a15">.html</text>
    <rect x="186" y="344" width="86" height="50" rx="14" fill="#f3e3cf" stroke="#a9622f" stroke-opacity="0.28"/>
    <text x="229" y="378" font-size="26" text-anchor="middle" font-family="'Cascadia Code','Consolas','Courier New',monospace" fill="#6d3a15">.htm</text>
    <line x1="74" y1="430" x2="286" y2="430" stroke="#583a25" stroke-opacity="0.12"/>
    <text x="74" y="486" font-size="32" font-weight="700" fill="#2f2724">Static assets</text>
    <text x="74" y="528" font-size="26" fill="#6f6056">CSS, images, fonts</text>
    <text x="74" y="568" font-size="26" fill="#6f6056">From page folder</text>
    <line x1="74" y1="604" x2="286" y2="604" stroke="#583a25" stroke-opacity="0.12"/>
    <text x="74" y="660" font-size="32" font-weight="700" fill="#2f2724">Sandbox</text>
    <text x="74" y="702" font-size="26" fill="#6f6056">No page scripts</text>
    <text x="74" y="742" font-size="26" fill="#6f6056">Forms blocked</text>

    <!-- arrow: input -> window -->
    <text x="344" y="482" font-size="25" text-anchor="middle" fill="#a9622f">Open</text>
    <line x1="320" y1="500" x2="360" y2="500" stroke="#a9622f" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- center: Obsidian window -->
    <rect x="376" y="212" width="772" height="580" rx="20" fill="#fffdfa" stroke="#583a25" stroke-opacity="0.12" stroke-width="1.5" filter="url(#soft)"/>
    <rect x="394" y="224" width="190" height="34" rx="9" fill="#fdf9f2" stroke="#583a25" stroke-opacity="0.12"/>
    <text x="410" y="247" font-size="26" fill="#2f2724">weekly.html</text>
    <text x="568" y="248" font-size="26" fill="#6f6056">×</text>
    <circle cx="1096" cy="241" r="2.5" fill="#6f6056"/>
    <circle cx="1110" cy="241" r="2.5" fill="#6f6056"/>
    <circle cx="1124" cy="241" r="2.5" fill="#6f6056"/>
    <line x1="376" y1="264" x2="1148" y2="264" stroke="#583a25" stroke-opacity="0.12"/>

    <!-- main view caption -->
    <rect x="392" y="292" width="10" height="10" rx="2" fill="#4f8f79"/>
    <text x="412" y="304" font-size="26" font-weight="600" fill="#5c4f46">Main view</text>
    <!-- sidebar caption -->
    <rect x="732" y="292" width="10" height="10" rx="2" fill="#7566c4"/>
    <text x="752" y="304" font-size="26" font-weight="600" fill="#5c4f46">Sidebar workbench</text>

    <!-- main view: four modes -->
    <rect x="392" y="322" width="328" height="50" rx="13" fill="#f5ecdf"/>
    <text x="446.4" y="355" font-size="25" text-anchor="middle" fill="#6f6056">Preview</text>
    <rect x="499.9" y="327" width="55.9" height="40" rx="9" fill="#fffdfa" stroke="#a9622f" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="527.9" y="355" font-size="25" font-weight="600" text-anchor="middle" fill="#6d3a15">Edit</text>
    <text x="604.5" y="355" font-size="25" text-anchor="middle" fill="#6f6056">Source</text>
    <text x="684.5" y="355" font-size="25" text-anchor="middle" fill="#6f6056">Split</text>

    <!-- main view: page mock -->
    <rect x="392" y="386" width="328" height="386" rx="14" fill="#fdf9f2" stroke="#583a25" stroke-opacity="0.12"/>
    <text x="416" y="424" font-size="26" fill="#a9622f">Week 38 · Report</text>
    <rect x="412" y="438" width="250" height="52" rx="8" fill="#fffdfa" stroke="#7566c4" stroke-width="2"/>
    <text x="430" y="472" font-size="32" font-weight="700" fill="#2f2724">This week</text>
    <rect x="416" y="508" width="280" height="10" rx="5" fill="#e7dbcd"/>
    <rect x="416" y="528" width="256" height="10" rx="5" fill="#e7dbcd"/>
    <rect x="416" y="548" width="204" height="10" rx="5" fill="#e7dbcd"/>
    <line x1="416" y1="580" x2="696" y2="580" stroke="#583a25" stroke-opacity="0.12"/>
    <circle cx="422" cy="601" r="5" fill="#4f7fa8"/>
    <text x="438" y="609" font-size="26" fill="#4f7fa8">View full report →</text>
    <rect x="414" y="628" width="26" height="20" rx="4" fill="#e0efe7" stroke="#4f8f79" stroke-width="1.5"/>
    <text x="452" y="646" font-size="26" fill="#6f6056">Cover image</text>
    <text x="416" y="730" font-size="26" fill="#6f6056">Click text, links, images</text>

    <line x1="726" y1="288" x2="726" y2="776" stroke="#583a25" stroke-opacity="0.12"/>

    <!-- sidebar: search field (not a tab) -->
    <rect x="732" y="318" width="400" height="48" rx="12" fill="#ffffff" stroke="#583a25" stroke-opacity="0.12"/>
    <circle cx="750" cy="340" r="7" fill="none" stroke="#6f6056" stroke-width="2"/>
    <line x1="755" y1="345" x2="761" y2="351" stroke="#6f6056" stroke-width="2" stroke-linecap="round"/>
    <text x="768" y="347" font-size="25" fill="#6f6056">Search text…</text>

    <!-- sidebar: four tabs -->
    <rect x="732" y="380" width="400" height="48" rx="12" fill="#f5ecdf"/>
    <rect x="738" y="384" width="57.9" height="40" rx="9" fill="#fffdfa" stroke="#a9622f" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="766.95" y="413" font-size="25" font-weight="600" text-anchor="middle" fill="#6d3a15">Edit</text>
    <line x1="801.9" y1="392" x2="801.9" y2="416" stroke="#583a25" stroke-opacity="0.14"/>
    <text x="807.9" y="413" font-size="25" fill="#6f6056">Outline</text>
    <line x1="894.2" y1="392" x2="894.2" y2="416" stroke="#583a25" stroke-opacity="0.14"/>
    <text x="900.7" y="413" font-size="25" fill="#6f6056">Changes</text>
    <line x1="1001.6" y1="392" x2="1001.6" y2="416" stroke="#583a25" stroke-opacity="0.14"/>
    <text x="1007.6" y="413" font-size="25" fill="#6f6056">Resources</text>

    <!-- sidebar: form -->
    <rect x="732" y="442" width="400" height="238" rx="14" fill="#fffdfa" stroke="#583a25" stroke-opacity="0.12"/>
    <text x="752" y="480" font-size="26" font-weight="600" fill="#2f2724">Text content</text>
    <text x="1112" y="480" font-size="26" text-anchor="end" fill="#6f6056">Heading</text>
    <rect x="752" y="492" width="360" height="88" rx="10" fill="#ffffff" stroke="#583a25" stroke-opacity="0.12"/>
    <text x="768" y="524" font-size="27" fill="#2f2724">This week</text>
    <text x="752" y="612" font-size="26" fill="#6f6056">Preview live · written on save</text>
    <rect x="752" y="626" width="224" height="40" rx="10" fill="#ffffff" stroke="#583a25" stroke-opacity="0.12"/>
    <text x="864" y="652" font-size="26" text-anchor="middle" fill="#2f2724">Paragraph editing</text>
    <text x="992" y="652" font-size="26" fill="#6f6056">Restore</text>

    <!-- sidebar: status & save -->
    <text x="732" y="722" font-size="26" fill="#6f6056">2 unsaved</text>
    <text x="732" y="756" font-size="26" fill="#6f6056">Draft backed up</text>
    <rect x="1048" y="708" width="84" height="40" rx="12" fill="#a9622f"/>
    <text x="1090" y="737" font-size="27" text-anchor="middle" fill="#ffffff">Save</text>

    <!-- arrow: window -> save & drafts -->
    <text x="1180" y="482" font-size="25" text-anchor="middle" fill="#a9622f">Save</text>
    <line x1="1156" y1="500" x2="1196" y2="500" stroke="#a9622f" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- right: save & drafts -->
    <rect x="1212" y="212" width="340" height="580" rx="20" fill="#fffdfa" stroke="#583a25" stroke-opacity="0.12" stroke-width="1.5" filter="url(#soft)"/>
    <text x="1238" y="282" font-size="34" font-weight="700" fill="#2f2724">Save &amp; drafts</text>
    <text x="1238" y="320" font-size="26" fill="#6f6056">How edits land</text>

    <rect x="1238" y="344" width="288" height="98" rx="14" fill="#fdf9f2" stroke="#583a25" stroke-opacity="0.12"/>
    <rect x="1250" y="362" width="4" height="42" rx="2" fill="#4f8f79"/>
    <text x="1264" y="380" font-size="30" font-weight="600" fill="#2f2724">Affected ranges</text>
    <text x="1264" y="412" font-size="25" fill="#6f6056">Tags, attrs, comments</text>

    <rect x="1238" y="452" width="288" height="98" rx="14" fill="#fdf9f2" stroke="#583a25" stroke-opacity="0.12"/>
    <rect x="1250" y="470" width="4" height="42" rx="2" fill="#4f7fa8"/>
    <text x="1264" y="488" font-size="30" font-weight="600" fill="#2f2724">Write back to file</text>
    <text x="1264" y="520" font-size="25" fill="#6f6056">Unsaved not on disk</text>

    <rect x="1238" y="560" width="288" height="98" rx="14" fill="#fdf9f2" stroke="#583a25" stroke-opacity="0.12"/>
    <rect x="1250" y="578" width="4" height="42" rx="2" fill="#c9963f"/>
    <text x="1264" y="596" font-size="30" font-weight="600" fill="#2f2724">Draft backup</text>
    <text x="1264" y="628" font-size="25" fill="#6f6056">Restored on restart</text>

    <rect x="1238" y="668" width="288" height="98" rx="14" fill="#fdf9f2" stroke="#583a25" stroke-opacity="0.12"/>
    <rect x="1250" y="686" width="4" height="42" rx="2" fill="#7566c4"/>
    <text x="1264" y="704" font-size="30" font-weight="600" fill="#2f2724">Three-way merge</text>
    <text x="1264" y="736" font-size="25" fill="#6f6056">Warns on disk change</text>

    <!-- bottom: extra capabilities -->
    <rect x="48" y="822" width="740" height="130" rx="18" fill="#fffdfa" stroke="#583a25" stroke-opacity="0.12" stroke-width="1.5" filter="url(#soft)"/>
    <rect x="74" y="852" width="44" height="44" rx="12" fill="#ece8f9"/>
    <rect x="88" y="861" width="22" height="26" rx="4" fill="none" stroke="#5847a8" stroke-width="2"/>
    <line x1="93" y1="871" x2="105" y2="871" stroke="#5847a8" stroke-width="2" stroke-linecap="round"/>
    <line x1="93" y1="878" x2="101" y2="878" stroke="#5847a8" stroke-width="2" stroke-linecap="round"/>
    <text x="136" y="880" font-size="30" font-weight="600" fill="#2f2724">Note embeds</text>
    <text x="136" y="922" font-size="26" fill="#6f6056">html-atelier code block</text>
    <rect x="352" y="848" width="79" height="44" rx="22" fill="#ece8f9"/>
    <text x="391.5" y="877" font-size="25" text-anchor="middle" font-family="'Cascadia Code','Consolas','Courier New',monospace" fill="#5847a8">path</text>
    <rect x="440" y="848" width="107" height="44" rx="22" fill="#ece8f9"/>
    <text x="493.5" y="877" font-size="25" text-anchor="middle" font-family="'Cascadia Code','Consolas','Courier New',monospace" fill="#5847a8">height</text>
    <rect x="556" y="848" width="93" height="44" rx="22" fill="#ece8f9"/>
    <text x="602.5" y="877" font-size="25" text-anchor="middle" font-family="'Cascadia Code','Consolas','Courier New',monospace" fill="#5847a8">width</text>
    <rect x="658" y="848" width="104" height="44" rx="22" fill="#ece8f9"/>
    <text x="710" y="877" font-size="25" text-anchor="middle" font-family="'Cascadia Code','Consolas','Courier New',monospace" fill="#5847a8">anchor</text>

    <rect x="812" y="822" width="740" height="130" rx="18" fill="#fffdfa" stroke="#583a25" stroke-opacity="0.12" stroke-width="1.5" filter="url(#soft)"/>
    <rect x="838" y="852" width="44" height="44" rx="12" fill="#e3eef7"/>
    <g transform="rotate(-40 860 874)">
      <rect x="844" y="867" width="24" height="14" rx="7" fill="none" stroke="#315f87" stroke-width="2"/>
      <rect x="862" y="867" width="24" height="14" rx="7" fill="none" stroke="#315f87" stroke-width="2"/>
    </g>
    <text x="900" y="880" font-size="30" font-weight="600" fill="#2f2724">Links &amp; anchors</text>
    <text x="900" y="922" font-size="26" fill="#6f6056">In-page anchors · vault files</text>
    <rect x="1323.6" y="848" width="77.1" height="44" rx="22" fill="#e3eef7"/>
    <text x="1362.15" y="877" font-size="26" text-anchor="middle" fill="#315f87">Back</text>
    <rect x="1408.7" y="848" width="117.3" height="44" rx="22" fill="#e3eef7"/>
    <text x="1467.35" y="877" font-size="26" text-anchor="middle" fill="#315f87">Forward</text>
  </g>
</svg>
